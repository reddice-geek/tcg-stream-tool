name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force

          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) {
            throw "CHARTE_LEGALE.txt introuvable"
          }

          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            throw "icon.ico introuvable"
          }

          if (!(Test-Path "src-tauri/icons/icon.png")) {
            throw "icon.png introuvable"
          }

          Write-Host "Fichiers installateur OK"

      - name: Install frontend dependencies
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: powershell
        run: npm run tauri build -- --bundles nsis

      - name: Rename Windows installer
        shell: powershell
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1

          if (!$installer) {
            throw "Installateur NSIS introuvable"
          }

          $newName = "TCG STREAM TOOL Setup $version.exe"
          $newPath = Join-Path $installer.DirectoryName $newName

          Rename-Item $installer.FullName $newName -Force

          Write-Host "Installateur renommé : $newPath"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCG-STREAM-TOOL-Windows
          path: |
            src-tauri/target/release/bundle/nsis/TCG STREAM TOOL Setup *.exe

      - name: Get version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "TCG STREAM TOOL v${{ steps.version.outputs.version }}"
          files: |
            src-tauri/target/release/bundle/nsis/TCG STREAM TOOL Setup *.exe
          body: |
            TCG STREAM TOOL v${{ steps.version.outputs.version }}

            Installateur Windows multilingue.

            Langues :
            - Français
            - English
            - Español
            - Italiano

            Fonctions principales :
            - Caméra
            - Détection de cartes
            - Overlay OBS
            - API TCG
            - Profils streamer
