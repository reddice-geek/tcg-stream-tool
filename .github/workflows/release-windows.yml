name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force

          Write-Host "=== Verification des fichiers ==="

          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) {
            throw "CHARTE_LEGALE.txt introuvable"
          }

          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            throw "icon.ico introuvable"
          }

          if (!(Test-Path "src-tauri/icons/icon.png")) {
            throw "icon.png introuvable"
          }

          Write-Host "Licence OK"
          Write-Host "ICO OK"
          Write-Host "PNG OK"

      - name: Install frontend dependencies
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: "TCG STREAM TOOL v__VERSION__"
          releaseBody: |
            Version Windows de TCG STREAM TOOL.

            Installateur multilingue :
            - Français
            - English
            - Español
            - Italiano

            Les conditions générales doivent être acceptées pendant l'installation.
          releaseDraft: false
          prerelease: false
