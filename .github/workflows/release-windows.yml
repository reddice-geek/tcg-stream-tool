name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For a published release, build the exact commit/tag of that release.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force
          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) { throw "CHARTE_LEGALE.txt introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "icon.ico introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.png")) { throw "icon.png introuvable" }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCG-STREAM-TOOL-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to the published GitHub Release
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
