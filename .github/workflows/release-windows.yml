name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force
          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) { throw "CHARTE_LEGALE.txt introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "icon.ico introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.png")) { throw "icon.png introuvable" }
          Write-Host "Fichiers installateur OK"

      - name: Install frontend dependencies
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: "TCG STREAM TOOL v__VERSION__"
          releaseBody: |
            Version Windows de TCG STREAM TOOL.

            - Caméra réelle avec sélection du périphérique
            - FPS caméra mesurés en direct
            - État et latence réels des API
            - YGOPRODeck et Pokémon TCG connectés aux vraies API
            - One Piece configurable dans les réglages
            - Recherche réelle de cartes Yu-Gi-Oh! via YGOPRODeck
            - Overlay local OBS/Streamlabs avec URL dédiée
            - Installateur multilingue + conditions générales

            Téléchargez le fichier .exe ci-dessous puis lancez l'installation.
          releaseDraft: false
          prerelease: false
