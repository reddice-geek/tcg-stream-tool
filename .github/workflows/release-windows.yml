name: Build Windows EXE + Updater

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force
          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) { throw "CHARTE_LEGALE.txt introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "icon.ico introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.png")) { throw "icon.png introuvable" }

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($conf -match "__REMPLACE_PAR_TA_CLE_PUBLIQUE_TAURI__") {
            throw "Cle publique updater non configuree dans src-tauri/tauri.conf.json"
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}")) {
            throw "Secret GitHub TAURI_SIGNING_PRIVATE_KEY manquant"
          }

          Write-Host "Fichiers + configuration updater OK"

      - name: Install frontend dependencies
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Build and publish Windows installer + updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: "TCG STREAM TOOL v__VERSION__"
          releaseBody: |
            TCG STREAM TOOL v__VERSION__

            Installation Windows et mise à jour automatique Tauri.

            Assets générés automatiquement :
            - installateur NSIS .exe
            - signature .sig
            - latest.json pour l'updater

            Après installation de cette version, les versions suivantes peuvent être détectées et installées directement depuis TCG STREAM TOOL.
          releaseDraft: false
          prerelease: false
