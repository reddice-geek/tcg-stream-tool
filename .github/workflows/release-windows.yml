name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Prepare installer files
        shell: powershell
        run: |
          Copy-Item "CHARTE_LEGALE.txt" "src-tauri/CHARTE_LEGALE.txt" -Force
          if (!(Test-Path "src-tauri/CHARTE_LEGALE.txt")) { throw "CHARTE_LEGALE.txt introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "icon.ico introuvable" }
          if (!(Test-Path "src-tauri/icons/icon.png")) { throw "icon.png introuvable" }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer (branch/manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer (branch/manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TCG-STREAM-TOOL-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: "TCG STREAM TOOL ${{ github.ref_name }}"
          releaseBody: |
            TCG STREAM TOOL

            Installateur Windows `.exe` généré automatiquement par GitHub Actions.
            Pour SmartScreen, Windows peut encore afficher un avertissement « éditeur inconnu » tant que l'application n'est pas signée avec un certificat de signature de code reconnu.
          releaseDraft: false
          prerelease: false
